<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/marca/favicon-64.png" />
    <link rel="apple-touch-icon" href="/marca/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3a386" />
    <title>Joyería Xavier</title>
    <script>
      // Aplica el tema del panel antes de pintar, para que no parpadee (JOY-88).
      try {
        if (location.pathname.startsWith('/panel')) {
          var t = localStorage.getItem('joyeria.tema')
          if (t !== 'claro' && t !== 'oscuro') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro'
          }
          document.documentElement.dataset.tema = t
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
