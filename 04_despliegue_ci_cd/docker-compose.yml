services:
  db:
    image: postgres:16-alpine
    container_name: joyeria_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-joyeria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia-esto}
      POSTGRES_DB: ${POSTGRES_DB:-joyeria}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-joyeria}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: joyeria_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: