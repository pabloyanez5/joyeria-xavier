# Nginx de staging: sirve la web, reenvía /api/ al backend y protege el panel del asesor.
# El archivo .htpasswd (usuario y clave del panel) se crea en el servidor y NO se sube al repositorio.

limit_req_zone $binary_remote_addr zone=agente:10m rate=30r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Panel del asesor: la página y sus datos piden usuario y clave.
    location ~ ^/panel(/.*)?$ {
        auth_basic "Panel del asesor";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files /index.html =404;
    }

    location ~ ^/api/(ordenes|clientes|conversaciones)(/.*)?$ {
        auth_basic "Panel del asesor";
        auth_basic_user_file /etc/nginx/.htpasswd;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        include /etc/nginx/conf.d/proxy.inc;
    }

    # El simulador de chat llama al modelo de IA: se limita la frecuencia para cuidar la cuota.
    location ~ ^/api/agente(/.*)?$ {
        limit_req zone=agente burst=10 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
