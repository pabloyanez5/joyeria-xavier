# Nginx de staging: sirve la web y reenvía /api/ al backend.
# El panel interno pide inicio de sesión en la propia aplicación (usuarios y roles, JOY-78):
# la API valida el token y el rol en cada operación, así que aquí ya no hay clave compartida.

limit_req_zone $binary_remote_addr zone=agente:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=sesion:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Panel interno: la página es pública, pero sin iniciar sesión no muestra ni recibe datos.
    location ~ ^/panel(/.*)?$ {
        try_files /index.html =404;
    }

    # Inicio de sesión: se limita la frecuencia para frenar los intentos de adivinar claves.
    location = /api/sesion {
        limit_req zone=sesion burst=5 nodelay;
        limit_req_status 429;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        include /etc/nginx/conf.d/proxy.inc;
    }

    # El simulador de chat llama al modelo de IA: se limita la frecuencia para cuidar la cuota.
    location ~ ^/api/agente(/.*)?$ {
        limit_req zone=agente burst=10 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
