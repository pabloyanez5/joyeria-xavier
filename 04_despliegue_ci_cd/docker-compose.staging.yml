# Entorno de pruebas (staging) en el VPS. Uso:
#   cd 04_despliegue_ci_cd
#   docker compose -f docker-compose.staging.yml up -d --build
# Lee los valores de 04_despliegue_ci_cd/.env (copia staging.env.example y complétalo).
# Solo Nginx publica un puerto (80); la base de datos y Redis quedan dentro de la red de Docker.

# Nombre propio del proyecto: así staging no se mezcla con el docker-compose.yml de desarrollo
# (que está en la misma carpeta) y tiene su propio volumen de datos.
name: joyeria-staging

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-joyeria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-joyeria}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-joyeria}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ../02_codigo_fuente/backend
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-joyeria}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-joyeria}
      REDIS_URL: redis://redis:6379/0
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-cambia-esto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      WEB_URL: ${WEB_URL:-http://localhost}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID:-}
      META_API_VERSION: ${META_API_VERSION:-v23.0}
      JOYERIA_WHATSAPP: ${JOYERIA_WHATSAPP:-}
      JOYERIA_INSTAGRAM: ${JOYERIA_INSTAGRAM:-}
      JOYERIA_MESSENGER: ${JOYERIA_MESSENGER:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build: ../02_codigo_fuente/frontend/web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy.inc:/etc/nginx/conf.d/proxy.inc:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro

volumes:
  pgdata:
